name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, '3.10', '3.11']

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8 black isort
    
    - name: Lint with flake8
      run: |
        # Stop build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Check code formatting with black
      run: |
        black --check --diff .
    
    - name: Check import sorting with isort
      run: |
        isort --check-only --diff .
    
    - name: Test configuration loading
      run: |
        python -c "
        import config
        print('✅ Configuration module loads successfully')
        # Test with mock values
        import os
        os.environ['AIRTABLE_API_KEY'] = 'test_key'
        os.environ['AIRTABLE_BASE_ID'] = 'test_base'
        os.environ['OPENAI_API_KEY'] = 'test_openai'
        try:
          config.validate_config()
          print('✅ Configuration validation works')
        except Exception as e:
          print(f'⚠️  Config validation: {e}')
        "
    
    - name: Test component imports
      run: |
        python -c "
        # Test all main components can be imported
        try:
          from json_compressor import JSONCompressor
          print('✅ JSONCompressor imports successfully')
        except Exception as e:
          print(f'❌ JSONCompressor import failed: {e}')
          exit(1)
        
        try:
          from shortlister import Shortlister  
          print('✅ Shortlister imports successfully')
        except Exception as e:
          print(f'❌ Shortlister import failed: {e}')
          exit(1)
        
        try:
          from llm_evaluator import LLMEvaluator
          print('✅ LLMEvaluator imports successfully') 
        except Exception as e:
          print(f'❌ LLMEvaluator import failed: {e}')
          exit(1)
        "
    
    - name: Test CLI interface
      run: |
        python main.py --help
        echo "✅ CLI interface works"
    
    - name: Run unit tests (if they exist)
      run: |
        if [ -f "test_*.py" ] || [ -d "tests/" ]; then
          pytest --cov=. --cov-report=xml
        else
          echo "No tests found, skipping pytest"
        fi

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install security tools
      run: |
        pip install bandit safety
    
    - name: Run security scan with bandit
      run: |
        bandit -r . -f json -o bandit-report.json || true
        bandit -r . || true
    
    - name: Check for known vulnerabilities with safety
      run: |
        pip install -r requirements.txt
        safety check || true

  documentation:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Check documentation completeness
      run: |
        echo "Checking documentation files..."
        
        # Check required files exist
        files=("README.md" "AIRTABLE_SCHEMA.md" "QUICK_START.md" ".env.example" "requirements.txt")
        for file in "${files[@]}"; do
          if [ -f "$file" ]; then
            echo "✅ $file exists"
          else
            echo "❌ $file missing"
            exit 1
          fi
        done
        
        # Check README has key sections
        sections=("Overview" "Setup Instructions" "Usage Guide" "Troubleshooting")
        for section in "${sections[@]}"; do
          if grep -q "$section" README.md; then
            echo "✅ README contains $section"
          else
            echo "❌ README missing $section"
            exit 1
          fi
        done
    
    - name: Validate configuration examples
      run: |
        echo "Checking .env.example format..."
        if grep -q "AIRTABLE_API_KEY" .env.example && grep -q "AIRTABLE_BASE_ID" .env.example; then
          echo "✅ Environment example file is properly formatted"
        else
          echo "❌ Environment example file missing required variables"
          exit 1
        fi

  deploy-staging:
    needs: [test, security-scan, documentation]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to staging
      run: |
        echo "🚀 Deploying to staging environment"
        # Add your staging deployment commands here
        # For example, deploying to AWS, Heroku, or other platforms
        echo "This would deploy the application to staging"
        
    - name: Run staging tests
      run: |
        echo "🧪 Running staging integration tests"
        # Add staging-specific tests here
        echo "Staging tests completed"

  deploy-production:
    needs: [test, security-scan, documentation]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    environment: production
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to production
      run: |
        echo "🚀 Deploying to production environment"
        # Add your production deployment commands here
        echo "This would deploy the application to production"
        
    - name: Create deployment notification
      run: |
        echo "📢 Production deployment completed successfully"
        # Add notification logic (Slack, email, etc.)

  docker-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          your-dockerhub-username/mercor-automation:latest
          your-dockerhub-username/mercor-automation:${{ github.event.release.tag_name }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
