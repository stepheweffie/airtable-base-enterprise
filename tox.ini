[tox]
envlist = py38,py39,py310,py311,flake8,mypy,safety
skipsdist = True

[gh-actions]
python =
    3.8: py38
    3.9: py39
    3.10: py310
    3.11: py311

[testenv]
deps = 
    -r{toxinidir}/requirements-dev.txt
commands = 
    pytest {posargs}
setenv =
    PYTHONPATH = {toxinidir}
    AIRTABLE_API_KEY = test_key
    AIRTABLE_BASE_ID = test_base
    OPENAI_API_KEY = test_openai

[testenv:flake8]
deps = 
    flake8
    flake8-docstrings
    flake8-import-order
commands = 
    flake8 *.py

[testenv:mypy]
deps = 
    mypy
    types-requests
commands = 
    mypy *.py --ignore-missing-imports

[testenv:safety]
deps = 
    safety
commands = 
    safety check

[testenv:bandit]
deps = 
    bandit
commands = 
    bandit -r *.py -f json -o bandit-report.json

[testenv:coverage]
deps = 
    -r{toxinidir}/requirements-dev.txt
commands = 
    pytest --cov=. --cov-report=html --cov-report=xml --cov-fail-under=80

[testenv:performance]
deps = 
    -r{toxinidir}/requirements-dev.txt
commands = 
    pytest test_performance.py -v -s

[testenv:integration]
deps = 
    -r{toxinidir}/requirements-dev.txt
commands = 
    pytest test_integration.py -v

[testenv:unit]
deps = 
    -r{toxinidir}/requirements-dev.txt
commands = 
    pytest test_unit.py test_basic.py -v

[testenv:docs]
deps = 
    mkdocs
    mkdocs-material
changedir = {toxinidir}
commands = 
    mkdocs build --clean

[flake8]
max-line-length = 120
exclude = 
    .git,
    __pycache__,
    .tox,
    venv,
    htmlcov,
    .coverage*
ignore = 
    E203,  # whitespace before ':'
    W503,  # line break before binary operator
max-complexity = 10

[mypy]
python_version = 3.8
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
ignore_missing_imports = True
